name: 🎮 NSWPedia to AbreHamrahi Game Sync Worker

on:
  schedule:
    # Run every 2 hours (e.g. 00:00, 02:00, 04:00, ...)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      single_url:
        description: '🔗 لینک صفحه بازی در NSWPedia (اختیاری برای دانلود تکی)'
        required: false
        type: string
      force_reupload:
        description: '⚡ دانلود و آپلود مجدد اجباری و نادیده گرفتن فایل‌های موجود در ابر (true / false)'
        required: false
        default: 'false'
        type: string
      limit:
        description: '📦 حداکثر تعداد بازی‌های صف در این اجرا (پیش‌فرض ۱۰)'
        required: false
        default: '10'
        type: string

concurrency:
  group: sync-games-pipeline
  cancel-in-progress: false

jobs:
  sync-games:
    name: 🚀 Download NSW ROMs & Upload to AbreHamrahi Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Safety ceiling to allow last active game up to 1h extra to finish

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧹 Maximize Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/Java*
          sudo rm -rf /opt/hostedtoolcache/go*
          sudo rm -rf /opt/hostedtoolcache/Ruby*
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: 📦 Install High-Speed Download Tools & RAR Archiver
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl rar unrar p7zip-full

      - name: ⚡ Execute Games Sync & Cloud Upload Pipeline
        working-directory: scripts/youtube-downloader
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://ninten2.ir' }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN || 'ninten2-sync-secret-key-2026' }}
          ABREHAMRAHI_REFRESH_TOKEN: ${{ secrets.ABREHAMRAHI_REFRESH_TOKEN }}
          MAX_RUN_MINUTES: '60' # Soft time limit: stops accepting new games after 60 min, letting current game finish
        run: |
          CMD="node sync_games.cjs --max-time-minutes 60"
          
          if [ -n "${{ github.event.inputs.single_url }}" ]; then
            CMD="$CMD --single-url \"${{ github.event.inputs.single_url }}\""
          fi

          if [ "${{ github.event.inputs.force_reupload }}" = "true" ]; then
            CMD="$CMD --force-reupload"
          fi

          if [ -n "${{ github.event.inputs.limit }}" ]; then
            CMD="$CMD --limit ${{ github.event.inputs.limit }}"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: 📋 Display Summary
        if: always()
        run: |
          echo "### 🎮 وضعیت اجرای ورکر بازی‌های نینتندو سوییچ" >> $GITHUB_STEP_SUMMARY
          echo "- **تاریخ اجرا:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **محدودیت زمانی نرم‌افزاری:** ۶۰ دقیقه (بازی‌های در حال دانلود اجازه اتمام پیدا کردند)" >> $GITHUB_STEP_SUMMARY
          echo "- **تکرار خودکار بعدی:** طبق کرون جاب هر ۲ ساعت یک‌بار" >> $GITHUB_STEP_SUMMARY
